<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRoute Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  color-scheme: dark;
  --bg: #0b1120;
  --surface: #111a2b;
  --surface-raised: #172338;
  --border: #26354d;
  --text: #edf3fb;
  --muted: #91a1b8;
  --accent: #6d72f5;
}

* { box-sizing: border-box; }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
}

button, select, input { font: inherit; }

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 76px;
  padding: 14px clamp(20px, 4vw, 56px);
  border-bottom: 1px solid var(--border);
  background: #0e1626;
}

.brand-mark {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border-radius: 12px;
  background: #252b55;
  color: #aeb1ff;
  font-size: 15px;
  font-weight: 750;
  letter-spacing: .04em;
}

.brand-copy h1 { margin: 0; font-size: 18px; font-weight: 650; }
.brand-copy p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

.dashboard {
  display: grid;
  max-width: 1500px;
  gap: 20px;
  margin: 0 auto;
  padding: 24px clamp(20px, 4vw, 56px) 40px;
}

.panel {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
}

.trip-planner { padding: 20px 22px 22px; }
.section-heading { margin-bottom: 18px; }
.section-heading h2 { margin: 0; font-size: 16px; font-weight: 650; }
.section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

.control-grid {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) minmax(240px, .8fr);
  align-items: end;
  gap: 18px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

select {
  width: 100%;
  min-height: 46px;
  padding: 0 13px;
  border: 1px solid #35445c;
  border-radius: 10px;
  outline: none;
  background: #0d1524;
  color: var(--text);
}

input[type="search"] {
  width: 100%;
  min-height: 38px;
  margin-bottom: 7px;
  padding: 0 11px;
  border: 1px solid #35445c;
  border-radius: 9px;
  outline: none;
  background: #0d1524;
  color: var(--text);
}

select:focus-visible, input[type="search"]:focus-visible,
.toggle button:focus-visible, .focus-button:focus-visible {
  outline: 2px solid #9295ff;
  outline-offset: 2px;
}

.toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  min-height: 46px;
  padding: 4px;
  border: 1px solid #293850;
  border-radius: 11px;
  background: #0d1524;
}

.toggle button {
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #b4c0d2;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.toggle button.active { background: var(--accent); color: #fff; }
.toggle button:not(.active):hover { background: #1a263b; color: var(--text); }

.map-panel { padding: 18px; }
.map-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 2px 14px;
}

.map-heading h2 { margin: 0; font-size: 16px; font-weight: 650; }
.map-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.focus-button {
  min-height: 38px;
  padding: 0 13px;
  border: 1px solid #35445c;
  border-radius: 9px;
  background: #172338;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}
.focus-button:hover { background: #24334d; }

#map {
  width: 100%;
  height: 70vh;
  min-height: 480px;
  border: 1px solid #1e2b40;
  border-radius: 12px;
  background: #0a1120;
  z-index: 0;
}

.leaflet-container {
  font-family: "Segoe UI", Arial, sans-serif;
}

.leaflet-tile-pane {
  filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6);
}

.leaflet-tooltip.city-tooltip {
  border: 1px solid #40516b;
  border-radius: 6px;
  background: #111a2b;
  color: #edf3fb;
  box-shadow: 0 4px 14px #0008;
}

.distance-label {
  border: 1px solid #30425d;
  border-radius: 5px;
  background: #0b1120eF;
  color: #edf3fb;
  font-size: 11px;
  font-weight: 650;
  line-height: 18px;
  padding: 0 5px;
  text-align: center;
  white-space: nowrap;
}

.leaflet-div-icon.distance-label {
  height: 20px !important;
}

.legend {
  display: flex;
  align-items: center;
  gap: 10px 20px;
  flex-wrap: wrap;
  padding: 14px 4px 2px;
  color: var(--muted);
  font-size: 12px;
}

.legend-item { white-space: nowrap; }
.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: 0;
}

.bar {
  display: inline-block;
  width: 58px;
  height: 7px;
  margin: 0 5px;
  border-radius: 5px;
  background: linear-gradient(90deg, hsl(120,75%,50%), hsl(60,75%,50%), hsl(0,75%,50%));
  vertical-align: 1px;
}

.routes-section { display: grid; gap: 14px; }
.routes-heading { margin: 0 2px; }
.routes-heading h2 { margin: 0; font-size: 16px; font-weight: 650; }
.routes-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.card {
  min-width: 0;
  padding: 17px 18px;
  border: 1px solid var(--border);
  border-top: 3px solid;
  border-radius: 13px;
  background: var(--surface);
}

.card h3 { margin: 0; font-size: 14px; font-weight: 650; }
.stats { display: flex; gap: 8px 18px; flex-wrap: wrap; margin: 12px 0; }
.stat { color: #c5d0e0; font-size: 12px; }
.stat strong { color: var(--text); font-weight: 650; }
.route-path { color: #b8c5d8; font-size: 12px; line-height: 1.65; }

.insight {
  padding: 13px 16px;
  border: 1px solid #145b4c;
  border-radius: 11px;
  background: #0b3c35;
  color: #b8f1db;
  font-size: 13px;
  line-height: 1.5;
}

.empty-state {
  grid-column: 1 / -1;
  margin: 0;
  padding: 22px;
  border: 1px dashed #35445c;
  border-radius: 12px;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 900px) {
  .control-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .control-grid .field:last-child { grid-column: 1 / -1; }
  .cards { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .topbar { min-height: 68px; padding-inline: 18px; }
  .dashboard { gap: 14px; padding: 16px 14px 28px; }
  .trip-planner, .map-panel { padding: 15px; }
  .control-grid { grid-template-columns: 1fr; gap: 14px; }
  .control-grid .field:last-child { grid-column: auto; }
  .map-heading { align-items: flex-start; }
  .legend { gap: 10px 14px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-mark" aria-hidden="true">SR</div>
  <div class="brand-copy">
    <h1>SafeRoute</h1>
    <p>Safety-aware route planning</p>
  </div>
</header>

<main class="dashboard">
  <section class="panel trip-planner" aria-labelledby="planner-title">
    <div class="section-heading">
      <h2 id="planner-title">Plan your trip</h2>
      <p>Choose your start, destination, and travel time.</p>
    </div>
    <div class="control-grid">
      <div class="field">
        <label for="from">Starting point</label>
        <input id="fromSearch" type="search" placeholder="Search places..." aria-label="Search starting places">
        <select id="from"></select>
      </div>
      <div class="field">
        <label for="to">Destination</label>
        <input id="toSearch" type="search" placeholder="Search places..." aria-label="Search destinations">
        <select id="to"></select>
      </div>
      <div class="field">
        <label>Time of travel</label>
        <div class="toggle" role="group" aria-label="Time of travel">
          <button id="dayBtn" class="active" type="button" aria-pressed="true">☀️ Day</button>
          <button id="nightBtn" type="button" aria-pressed="false">🌙 Night</button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel map-panel" aria-labelledby="map-title">
    <div class="map-heading">
      <div>
        <h2 id="map-title">Route map</h2>
        <p>Compare road risk and available routes at a glance.</p>
      </div>
      <button id="focusTricity" class="focus-button" type="button">Focus Tricity</button>
    </div>
    <div id="map" role="application" aria-label="Interactive map of towns and routes across Punjab"></div>
    <div class="legend" aria-label="Map legend">
      <span class="legend-item">Road risk: low<span class="bar"></span>high</span>
      <span class="legend-item"><span class="dot" style="background:#22d3ee"></span>Safe spot</span>
      <span class="legend-item"><span class="dot" style="background:#38bdf8"></span>Fastest</span>
      <span class="legend-item"><span class="dot" style="background:#fbbf24"></span>Balanced</span>
      <span class="legend-item"><span class="dot" style="background:#4ade80"></span>Safest</span>
    </div>
  </section>

  <section class="routes-section" aria-labelledby="routes-title">
    <div class="routes-heading">
      <h2 id="routes-title">Route options</h2>
      <p>Choose the route that best fits your priorities.</p>
    </div>
    <div class="cards" id="cards"></div>
    <div class="insight" id="insight" role="status"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const modes = [
  {key:"fastest",  label:"Fastest",  color:"#38bdf8"},
  {key:"balanced", label:"Balanced", color:"#fbbf24"},
  {key:"safest",   label:"Safest",   color:"#4ade80"}
];
const locations = cityData.locations;
let night = 0;
const from = document.getElementById("from");
const to = document.getElementById("to");
const fromSearch = document.getElementById("fromSearch");
const toSearch = document.getElementById("toSearch");
const map = L.map("map").setView([31.0, 75.5], 8);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(map);
const roadLayer = L.layerGroup().addTo(map);
const townLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const distanceLayer = L.layerGroup().addTo(map);
const roadsByPair = new Map();
cityData.roads.forEach(road => roadsByPair.set(
  Math.min(road.from, road.to) + "-" + Math.max(road.from, road.to), road));

const sortedLocations = locations.slice().sort((a, b) => a.name.localeCompare(b.name));
function populateSelect(select, searchText) {
  const selected = select.value;
  const query = searchText.trim().toLocaleLowerCase();
  const matches = sortedLocations.filter(location =>
    location.name.toLocaleLowerCase().includes(query));
  select.replaceChildren(...matches.map(location => new Option(location.name, location.id)));
  if (matches.some(location => String(location.id) === selected)) {
    select.value = selected;
  } else if (matches.length) {
    select.value = String(matches[0].id);
  }
}
populateSelect(from, "");
populateSelect(to, "");
from.value = String(locations.find(location => location.name === "Amritsar").id);
to.value = String(locations.find(location => location.name === "Chandigarh").id);

function riskColor(risk) {
  const hue = 120 - 120 * Math.max(0, Math.min(1, (risk - 1) / 9));
  return `hsl(${hue}, 75%, 45%)`;
}

function drawBaseMap() {
  roadLayer.clearLayers();
  townLayer.clearLayers();
  cityData.roads.forEach(road => {
    const a = locations[road.from], b = locations[road.to];
    const risk = Math.min(10, road.risk * (night ? 1.5 : 1));
    L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {
      color: riskColor(risk), weight: 2, opacity: 0.72
    }).addTo(roadLayer);
  });
  locations.forEach(location => {
    if (map.getZoom() < 11 && (location.detailed || location.tier !== 1)) return;
    const marker = L.circleMarker([location.lat, location.lon], {
      radius: location.tier === 1 ? 8 : location.tier === 2 ? 6 : 4,
      color: location.safe ? "#22d3ee" : "#cbd5e1",
      fillColor: location.safe ? "#22d3ee" : "#94a3b8",
      fillOpacity: 0.95,
      weight: 1.5
    });
    marker.bindTooltip(location.name, {direction:"top", offset:[0,-5], className:"city-tooltip"});
    marker.addTo(townLayer);
  });
}

function getRoutes(source, destination) {
  const sourceRoutes = cityData.routes[String(source)];
  if (!sourceRoutes) return null;
  const time = night ? "night" : "day";
  const result = {};
  for (const mode of modes) {
    const saved = sourceRoutes[mode.key][time];
    const path = [destination];
    let current = destination;
    for (let step = 0; current !== source && step < locations.length; step++) {
      current = saved.parent[current];
      if (current < 0) return null;
      path.push(current);
    }
    if (current !== source) return null;
    path.reverse();
    result[mode.key] = {
      path,
      distance: saved.distance[destination],
      avgRisk: saved.risk[destination]
    };
  }
  return result;
}

function drawRouteDistanceLabels(routes) {
  distanceLayer.clearLayers();
  if (!routes || map.getZoom() < 11) return;
  const labelledRoads = new Set();
  modes.forEach(mode => {
    const path = routes[mode.key].path;
    for (let i = 0; i + 1 < path.length; i++) {
      const aId = path[i], bId = path[i + 1];
      const key = Math.min(aId, bId) + "-" + Math.max(aId, bId);
      if (labelledRoads.has(key)) continue;
      const a = locations[aId], b = locations[bId];
      if (!a.tricity && !b.tricity) continue;
      labelledRoads.add(key);
      const road = roadsByPair.get(key);
      const label = L.marker([(a.lat + b.lat) / 2, (a.lon + b.lon) / 2], {
        interactive:false,
        icon:L.divIcon({className:"distance-label", html:`${road.distance.toFixed(1)} km`, iconSize:null})
      });
      label.addTo(distanceLayer);
    }
  });
}

function drawRoutes() {
  const source = from.value === "" ? -1 : Number(from.value);
  const destination = to.value === "" ? -1 : Number(to.value);
  routeLayer.clearLayers();
  distanceLayer.clearLayers();
  if (source < 0 || destination < 0) {
    showCards(null);
    return;
  }
  if (source === destination) {
    showCards(null);
    return;
  }
  const routes = getRoutes(source, destination);
  if (!routes || modes.some(mode => !routes[mode.key])) {
    showCards(null);
    return;
  }

  const bounds = [];
  ["safest", "balanced", "fastest"].forEach(key => {
    const mode = modes.find(item => item.key === key);
    const route = routes[key];
    const positions = route.path.map(id => [locations[id].lat, locations[id].lon]);
    positions.forEach(position => bounds.push(position));
    L.polyline(positions, {
      color: mode.color, weight: 7, opacity: 0.92, lineCap: "round", lineJoin: "round"
    }).addTo(routeLayer);
  });

  drawRouteDistanceLabels(routes);
  if (bounds.length) map.fitBounds(bounds, {padding:[36,36], maxZoom:13});
  showCards(routes);
}

function draw() {
  drawBaseMap();
  drawRoutes();
}

function showCards(res){
  const box = document.getElementById("cards");
  const ins = document.getElementById("insight");
  if (!res) {
    box.innerHTML = '<p class="empty-state">Choose two different places to compare routes.</p>';
    ins.style.display = "none";
    return;
  }
  box.innerHTML = modes.map(m => {
    const r = res[m.key];
    return `<article class="card" style="border-top-color:${m.color}">
      <h3>${m.label}</h3>
      <div class="stats">
        <span class="stat">Distance <strong>${r.distance.toFixed(1)} km</strong></span>
        <span class="stat">Risk <strong>${r.avgRisk.toFixed(1)}/10</strong></span>
      </div>
      <div class="route-path">${r.path.map(i => locations[i].name).join(" → ")}</div>
    </article>`;
  }).join("");
  const f = res.fastest, sf = res.safest;
  const extra = sf.distance - f.distance;
  const drop = f.avgRisk > 0 ? (f.avgRisk - sf.avgRisk) / f.avgRisk * 100 : 0;
  ins.style.display = "block";
  ins.textContent = (extra < 0.05 && drop < 1)
    ? "Fastest and safest route are the same for this trip."
    : `Safest route is ${extra.toFixed(1)} km longer but ${drop.toFixed(0)}% lower risk.`;
}

function setTime(n){
  night = n;
  document.getElementById("dayBtn").classList.toggle("active", n === 0);
  document.getElementById("nightBtn").classList.toggle("active", n === 1);
  document.getElementById("dayBtn").setAttribute("aria-pressed", String(n === 0));
  document.getElementById("nightBtn").setAttribute("aria-pressed", String(n === 1));
  draw();
}
document.getElementById("dayBtn").onclick = () => setTime(0);
document.getElementById("nightBtn").onclick = () => setTime(1);
from.onchange = draw;
to.onchange = draw;
fromSearch.addEventListener("input", () => {
  populateSelect(from, fromSearch.value);
  draw();
});
toSearch.addEventListener("input", () => {
  populateSelect(to, toSearch.value);
  draw();
});
document.getElementById("focusTricity").onclick = () => {
  const focusNames = ["Chandigarh", "Mohali", "Panchkula"];
  const bounds = L.latLngBounds(focusNames.map(name => {
    const location = locations.find(item => item.name === name);
    return [location.lat, location.lon];
  }));
  map.fitBounds(bounds, {padding:[36,36], maxZoom:12});
};
map.on("zoomend", () => {
  drawBaseMap();
  if (from.value !== "" && to.value !== "" && from.value !== to.value) {
    drawRouteDistanceLabels(getRoutes(Number(from.value), Number(to.value)));
  }
});
draw();
</script>
</body>
</html>
